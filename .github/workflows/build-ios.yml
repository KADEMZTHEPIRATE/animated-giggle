name: Build HL2SBPP iOS arm64 Dylibs

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  generate-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode Project
        working-directory: ./hl2sb-src-master/src
        run: |
          touch game/shared/gamestats.h
          chmod +x ./devtools/bin/* ./creategameprojects.sh
          ./devtools/bin/vpc_linux /osx32 /hl2mp +game /mksln games || ./devtools/bin/vpc_linux /osx64 /hl2mp +game /mksln games
      - uses: actions/upload-artifact@v4
        with:
          name: generated-xcodeproj
          path: hl2sb-src-master/src

  build-ios:
    needs: generate-project
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: generated-xcodeproj
          path: hl2sb-src-master/src
      - run: brew install ldid simde
      - name: Patch ARM64 Headers & Build Dylibs
        working-directory: ./hl2sb-src-master/src
        run: |
          chmod -R +x devtools/bin
          mkdir -p arm64_shims
          SIMDE_INC="$(brew --prefix simde)/include"
          printf '#define SIMDE_ENABLE_NATIVE_ALIASES\n#include "%s/simde/x86/mmx.h"\n' "$SIMDE_INC" > arm64_shims/mmintrin.h
          printf '#define SIMDE_ENABLE_NATIVE_ALIASES\n#include "%s/simde/x86/sse.h"\n' "$SIMDE_INC" > arm64_shims/xmmintrin.h
          printf '#define SIMDE_ENABLE_NATIVE_ALIASES\n#include "%s/simde/x86/sse2.h"\n' "$SIMDE_INC" > arm64_shims/emmintrin.h
          printf '#define SIMDE_ENABLE_NATIVE_ALIASES\n#include "%s/simde/x86/sse3.h"\n' "$SIMDE_INC" > arm64_shims/pmmintrin.h

          python3 - << 'EOF'
          import pathlib, re
          def sub_file(path, fn):
              p = pathlib.Path(path)
              if p.exists(): p.write_text(fn(p.read_text(errors="ignore")))

          sub_file("public/tier0/platform.h", lambda s: "#include <mach/mach_time.h>\n#include <malloc/malloc.h>\n#define malloc_usable_size malloc_size\n#define PLATFORM_64BITS 1\n#define VALVE_LITTLE_ENDIAN 1\n" + re.sub(r'typedef\s+\w+(?:\s+\w+)?\s+HMODULE\s*;', 'typedef void* HMODULE;', "\n".join("// "+l if any(w in l for w in ["asm","=a","=d","rdtsc"]) and any('"=a"' in x or "'=a'" in x for x in s.splitlines()[max(0,i-3):i+4]) else l for i,l in enumerate(s.splitlines()))).replace('"int $3"','"brk #0"').replace('"int 3"','"brk #0"'))
          sub_file("public/tier0/dbg.h", lambda s: s.replace('"int $3"','"brk #0"').replace('"int 3"','"brk #0"'))
          sub_file("public/tier0/threadtools.h", lambda s: s.replace("COMPILE_TIME_ASSERT( sizeof(T) == sizeof(long) );","").replace('"pause"','"yield"'))
          sub_file("mathlib/sse.cpp", lambda s: "// Disabled x86 SSE asm\n")

          m = pathlib.Path("public/mathlib/mathlib.h")
          ml = m.read_text(errors="ignore").splitlines()
          for i, l in enumerate(ml):
              if "Unknown architecture" in l: ml[i] = "// " + l
              elif '"=t"' in l:
                  for k in range(max(0,i-3), min(len(ml),i+3)):
                      if any(w in ml[k] for w in ["asm","fsincos","=t","radians"]): ml[k] = "// " + ml[k]
                  ml[i] = "*sine = sinf(radians); *cosine = cosf(radians);"
              elif '"fistpl %0;"' in l:
                  ml[i-1], ml[i], ml[i+1] = "// "+ml[i-1], "*((int64*)nResult) = (int64)lrintf(f);", "// "+ml[i+1]
          m.write_text("#include <cmath>\n" + "\n".join(ml))

          for st in pathlib.Path(".").rglob("strtools.cpp"):
              st.write_text(st.read_text(errors="ignore").replace("conv_t > 0","conv_t != (iconv_t)-1").replace("conv_t < 0","conv_t == (iconv_t)-1"))
          for pd in pathlib.Path(".").rglob("processor_detect_linux.cpp"):
              pd.write_text("bool CheckMMXTechnology(void){return false;}\nbool CheckSSETechnology(void){return false;}\nbool CheckSSE2Technology(void){return false;}\nbool Check3DNowTechnology(void){return false;}\n")
          for rt in pathlib.Path(".").rglob("reliabletimer.cpp"):
              rl = rt.read_text(errors="ignore").splitlines()
              for i, l in enumerate(rl):
                  if '"=A"' in l or "'=A'" in l:
                      for k in range(max(0,i-2), min(len(rl),i+3)):
                          if any(w in rl[k] for w in ["asm","rdtsc","=A",");"]): rl[k] = "// " + rl[k]
                      rl[i] = "return mach_absolute_time();"
              rt.write_text("#include <mach/mach_time.h>\n" + "\n".join(rl))

          for fp in ("public/tier1/interface.h", "tier1/interface.cpp"):
              sub_file(fp, lambda s: re.sub(r'#define\s+HMODULE\s+.*', 'typedef void* HMODULE;', re.sub(r'typedef\s+\w+(?:\s+\w+)?\s+HMODULE\s*;', 'typedef void* HMODULE;', s)))
          for mp in pathlib.Path(".").rglob("mempool.h"):
              ml2 = mp.read_text(errors="ignore").splitlines()
              for i in range(max(0,455), min(len(ml2),466)): ml2[i] = re.sub(r'\buint\w*\b|\bunsigned(?:\s+int)?\b', 'uintptr_t', ml2[i])
              mp.write_text("#include <stdint.h>\n" + "\n".join(ml2))
          for kv in pathlib.Path(".").rglob("kvpacker.cpp"):
              kl = kv.read_text(errors="ignore").splitlines()
              for i in range(max(0,144), min(len(kl),152)): kl[i] = re.sub(r'\(\s*int\s*\)', '(intptr_t)', kl[i])
              kv.write_text("#include <stdint.h>\n" + "\n".join(kl))
          for dm in pathlib.Path(".").rglob("datamanager.h"):
              dl = dm.read_text(errors="ignore").splitlines()
              if len(dl) > 253: dl = re.sub(r'\bunsigned\s+int\b|\buint\w*\b', 'uintptr_t', dl)
              dm.write_text("#include <stdint.h>\n" + "\n".join(dl))
          for cc in pathlib.Path(".").rglob("checksum_crc.cpp"):
              cl = cc.read_text(errors="ignore").splitlines()
              for i in range(max(0,146), min(len(cl),154)): cl[i] = re.sub(r'\bunsigned\s+int\b|\buint\w*\b', 'uintptr_t', cl[i])
              cc.write_text("#include <stdint.h>\n" + "\n".join(cl))
          for uh in pathlib.Path(".").rglob("utlhash.h"):
              uh.write_text("#include <stdint.h>\n" + re.sub(r'typedef\s+\w+\s+UtlHashFixedHandle_t\s*;', 'typedef intptr_t UtlHashFixedHandle_t;', uh.read_text(errors="ignore")))
          for kvc in pathlib.Path(".").rglob("KeyValues.cpp"):
              kvl = kvc.read_text(errors="ignore").splitlines()
              for i in range(max(0,2520), min(len(kvl),2536)): kvl[i] = re.sub(r'\b(?:unsigned\s+)?int\b|\buint\w*\b', 'intptr_t', kvl[i])
              kvc.write_text("#include <stdint.h>\n" + "\n".join(kvl))
          for vh in pathlib.Path(".").rglob("VGUI.h"):
              vh.write_text("#include <stdint.h>\n" + re.sub(r'typedef\s+unsigned\s+int\s+VPANEL\s*;', 'typedef uintptr_t VPANEL;', vh.read_text(errors="ignore")))
          EOF

          sed -i '' 's|/home/runner/|/Users/runner/|g' games.xcodeproj/project.pbxproj
          sed -i '' 's|MACOSX_DEPLOYMENT_TARGET.*|IPHONEOS_DEPLOYMENT_TARGET = 13.0;|g; s|ARCHS = .*|ARCHS = arm64;|g; s|SDKROOT = .*|SDKROOT = iphoneos;|g; s|CC = .*||g; s|CPLUSPLUS = .*||g' devtools/*.xcconfig || true
          sed -i '' 's|-msse[0-9.]*||g; s|-mfpmath=sse||g; s|-arch i386||g; s|-arch x86_64||g; s|-m32||g' devtools/*.xcconfig games.xcodeproj/project.pbxproj || true
          SHIM_PATH="$(pwd)/arm64_shims"
          xcodebuild -project games.xcodeproj -alltargets -configuration Release -sdk iphoneos ARCHS="arm64" ONLY_ACTIVE_ARCH=NO IPHONEOS_DEPLOYMENT_TARGET="13.0" CODE_SIGNING_ALLOWED=NO OTHER_CFLAGS="\$(inherited) -isystem $SHIM_PATH -fpermissive -Wno-error -DNO_STEAM -D_LINUX -DPOSIX -DNO_MALLOC_OVERRIDE -D__x86_64__" OTHER_CPLUSPLUSFLAGS="\$(inherited) -isystem $SHIM_PATH -std=gnu++11 -fpermissive -Wno-error -DNO_STEAM -D_LINUX -DPOSIX -DNO_MALLOC_OVERRIDE -D__x86_64__" OTHER_LDFLAGS="\$(inherited) -undefined dynamic_lookup" build > xcode.log 2>&1 || true
          echo "=== UNIQUE SHORT ERRORS ==="
          grep -E "error:|fatal error:" xcode.log | sed 's|.*/src/||' | sort -u | head -n 15

      - name: Collect & Pseudo-Sign Dylibs for iOS
        run: |
          mkdir -p final_ios_dylibs
          cp hl2sb-src-master/src/xcode.log final_ios_dylibs/xcode.log || true
          find . ~/Library/Developer/Xcode/DerivedData -type f \( -name "client.dylib" -o -name "client.so" -o -name "client" \) -exec cp {} final_ios_dylibs/client.dylib \; 2>/dev/null || true
          find . ~/Library/Developer/Xcode/DerivedData -type f \( -name "server.dylib" -o -name "server.so" -o -name "server" \) -exec cp {} final_ios_dylibs/server.dylib \; 2>/dev/null || true
          ldid -S final_ios_dylibs/*.dylib || true
          ls -lh final_ios_dylibs/

      - uses: actions/upload-artifact@v4
        with:
          name: hl2sbpp-ios-arm64-dylibs
          path: final_ios_dylibs/*
