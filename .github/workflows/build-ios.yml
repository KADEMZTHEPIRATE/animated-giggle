name: Build HL2SBPP iOS arm64 Dylibs

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout HL2SBPP Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools & ldid
        run: |
          brew install cmake ninja pkg-config ldid

      - name: Build client.dylib and server.dylib for iOS arm64
        run: |
          cd hl2sb-src-master
          if [ -f "CMakeLists.txt" ]; then
            cmake -B build-ios -G Ninja \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build build-ios --target client server -j$(sysctl -n hw.ncpu)
          elif [ -f "wscript" ]; then
            python3 ./waf configure --ios --arch=arm64 -T release
            python3 ./waf build --targets=client,server
          elif [ -f "src/CMakeLists.txt" ]; then
            cmake -S src -B build-ios -G Ninja \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build build-ios --target client server -j$(sysctl -n hw.ncpu)
          elif [ -f "src/wscript" ]; then
            cd src
            python3 ./waf configure --ios --arch=arm64 -T release
            python3 ./waf build --targets=client,server
          elif [ -d "src" ]; then
            echo "Found VPC source tree. Listing files inside hl2sb-src-master/src:"
            ls -la src
            exit 1
          else
            echo "Listing files inside hl2sb-src-master:"
            ls -la
            exit 1
          fi

      - name: Pseudo-Sign Dylibs for iOS (ldid)
        run: |
          find . -name "client.dylib" -o -name "server.dylib" | xargs ldid -S

      - name: Upload iOS arm64 Dylibs
        uses: actions/upload-artifact@v4
        with:
          name: hl2sbpp-ios-arm64-dylibs
          path: |
            **/client.dylib
            **/server.dylib
