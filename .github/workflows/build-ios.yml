name: Build HL2SBPP iOS arm64 Dylibs

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout HL2SBPP Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ldid
        run: brew install ldid

      - name: Build Native 64-bit VPC & Generate Xcode Project
        working-directory: ./hl2sb-src-master/src
        run: |
          echo "Inspecting utils/vpc..."
          ls -la utils/vpc
          if [ -f "utils/vpc/vpc/vpc.mak" ]; then
            make -C utils/vpc/vpc -f vpc.mak
          elif [ -f "utils/vpc/Makefile" ]; then
            make -C utils/vpc
          else
            clang++ -O2 -std=c++11 -DOSX -DPOSIX -D_LINUX -DGNUC -DNDEBUG -DNO_MALLOC_OVERRIDE \
              -Ipublic -Ipublic/tier0 -Ipublic/tier1 -Icommon -Iutils/vpc/vpc \
              utils/vpc/vpc/*.cpp tier1/*.cpp \
              -o devtools/bin/vpc_osx -liconv || true
          fi
          find utils/vpc -type f -perm +111 -exec cp {} devtools/bin/vpc_osx \; || true
          chmod +x ./devtools/bin/* ./creategameprojects.sh
          ./creategameprojects.sh
          ls -la *.xcodeproj || true

      - name: Build client.dylib and server.dylib for iOS arm64
        working-directory: ./hl2sb-src-master/src
        run: |
          xcodebuild -list -project games.xcodeproj
          xcodebuild -project games.xcodeproj \
            -alltargets \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET="13.0" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Pseudo-Sign Dylibs for iOS
        run: find . -name "*.dylib" -exec ldid -S {} + || true

      - name: Upload iOS arm64 Dylibs
        uses: actions/upload-artifact@v4
        with:
          name: hl2sbpp-ios-arm64-dylibs
          path: |
            **/client.dylib
            **/server.dylib
            **/*.dylib
