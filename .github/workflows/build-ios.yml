name: Build HL2SBPP iOS arm64 Dylibs

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  generate-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Xcode Project using Linux VPC
        working-directory: ./hl2sb-src-master/src
        run: |
          touch game/shared/gamestats.h
          chmod +x ./devtools/bin/* ./creategameprojects.sh
          ./devtools/bin/vpc_linux /osx32 /hl2mp +game /mksln games || ./devtools/bin/vpc_linux /osx64 /hl2mp +game /mksln games

      - name: Save Generated Project Files
        uses: actions/upload-artifact@v4
        with:
          name: generated-xcodeproj
          path: hl2sb-src-master/src

  build-ios:
    needs: generate-project
    runs-on: macos-latest

    steps:
      - name: Download Source with Generated Project
        uses: actions/download-artifact@v4
        with:
          name: generated-xcodeproj
          path: hl2sb-src-master/src

      - name: Install ldid & simde
        run: brew install ldid simde

      - name: Patch ARM64 Headers & Build Dylibs
        working-directory: ./hl2sb-src-master/src
        run: |
          chmod -R +x devtools/bin
          mkdir -p arm64_shims
          SIMDE_INC="$(brew --prefix simde)/include"
          printf '#define SIMDE_ENABLE_NATIVE_ALIASES\n#include "%s/simde/x86/mmx.h"\n' "$SIMDE_INC" > arm64_shims/mmintrin.h
          printf '#define SIMDE_ENABLE_NATIVE_ALIASES\n#include "%s/simde/x86/sse.h"\n' "$SIMDE_INC" > arm64_shims/xmmintrin.h
          printf '#define SIMDE_ENABLE_NATIVE_ALIASES\n#include "%s/simde/x86/sse2.h"\n' "$SIMDE_INC" > arm64_shims/emmintrin.h
          printf '#define SIMDE_ENABLE_NATIVE_ALIASES\n#include "%s/simde/x86/sse3.h"\n' "$SIMDE_INC" > arm64_shims/pmmintrin.h

          python3 - << 'EOF'
          import pathlib, re

          # 1. Patch platform.h: replace x86 rdtsc (=a) with mach_absolute_time()
          p = pathlib.Path("public/tier0/platform.h")
          txt = p.read_text(errors="ignore")
          txt = re.sub(r'__asm__\s+__volatile__\s*\(\s*"rdtsc"[^;]*?;', 'return mach_absolute_time();', txt, flags=re.S)
          txt = re.sub(r'asm\s+volatile\s*\(\s*"rdtsc"[^;]*?;', 'return mach_absolute_time();', txt, flags=re.S)
          lines = txt.splitlines()
          for idx, line in enumerate(lines):
              if '"=a"' in line or "'=a'" in line:
                  for k in range(max(0, idx-3), min(len(lines), idx+4)):
                      if "asm" in lines[k] or "=a" in lines[k] or "=d" in lines[k] or "rdtsc" in lines[k]:
                          lines[k] = "// " + lines[k]
          txt = "#include <mach/mach_time.h>\n#define PLATFORM_64BITS 1\n#define VALVE_LITTLE_ENDIAN 1\n" + "\n".join(lines)
          p.write_text(txt)

          # 2. Patch mathlib.h: replace x87 fsincos/fsqrt (=t / t) with standard sinf/cosf/sqrtf
          m = pathlib.Path("public/mathlib/mathlib.h")
          mtxt = m.read_text(errors="ignore")
          mtxt = mtxt.replace('#error "Unknown architecture"', '// #error "Unknown architecture"')
          mtxt = mtxt.replace('#error Unknown architecture', '// #error Unknown architecture')
          mtxt = re.sub(
              r'inline\s+void\s+SinCos\s*\(\s*float\s+radians\s*,\s*float\s*\*\s*sine\s*,\s*float\s*\*\s*cosine\s*\)\s*\{.*?\n\}',
              'inline void SinCos( float radians, float *sine, float *cosine ) { *sine = sinf(radians); *cosine = cosf(radians); }',
              mtxt, flags=re.S
          )
          mlines = mtxt.splitlines()
          for idx, line in enumerate(mlines):
              if '"=t"' in line or '"t"' in line:
                  for k in range(max(0, idx-4), min(len(mlines), idx+4)):
                      if any(w in mlines[k] for w in ["asm", "=t", '"t"', "fsin", "fcos", "fsqrt", "fld", "fstp"]):
                          mlines[k] = "// " + mlines[k]
          m.write_text("#include <cmath>\n" + "\n".join(mlines))

          # 3. Patch threadtools.h: add default constructor to CInterlockedIntT and skip 32-bit ThreadId_t assert
          t = pathlib.Path("public/tier0/threadtools.h")
          ttxt = t.read_text(errors="ignore")
          ttxt = ttxt.replace("CInterlockedIntT( T value )", "CInterlockedIntT() : m_value( 0 ) {}\n\tCInterlockedIntT( T value )")
          tlines = ttxt.splitlines()
          if len(tlines) >= 422 and "COMPILE_TIME_ASSERT" in tlines[421]:
              tlines[421] = "// " + tlines[421]
          t.write_text("\n".join(tlines))
          EOF

          sed -i '' 's|/home/runner/|/Users/runner/|g' games.xcodeproj/project.pbxproj
          sed -i '' 's|MACOSX_DEPLOYMENT_TARGET.*|IPHONEOS_DEPLOYMENT_TARGET = 13.0;|g' devtools/*.xcconfig || true
          sed -i '' 's|ARCHS = .*|ARCHS = arm64;|g' devtools/*.xcconfig || true
          sed -i '' 's|SDKROOT = .*|SDKROOT = iphoneos;|g' devtools/*.xcconfig || true
          sed -i '' 's|CC = .*||g; s|CPLUSPLUS = .*||g' devtools/*.xcconfig || true
          sed -i '' 's|-msse[0-9.]*||g; s|-mfpmath=sse||g; s|-arch i386||g; s|-arch x86_64||g; s|-m32||g' devtools/*.xcconfig games.xcodeproj/project.pbxproj || true
          SHIM_PATH="$(pwd)/arm64_shims"
          set -o pipefail
          xcodebuild -project games.xcodeproj \
            -alltargets \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET="13.0" \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_CFLAGS="\$(inherited) -isystem $SHIM_PATH -fpermissive -Wno-error -DNO_STEAM -D_LINUX -DPOSIX -DNO_MALLOC_OVERRIDE -D__x86_64__" \
            OTHER_CPLUSPLUSFLAGS="\$(inherited) -isystem $SHIM_PATH -std=c++11 -fpermissive -Wno-error -DNO_STEAM -D_LINUX -DPOSIX -DNO_MALLOC_OVERRIDE -D__x86_64__" \
            build 2>&1 | grep -E "error:|fatal error:|BUILD SUCCEEDED|BUILD FAILED" | head -n 40

      - name: Pseudo-Sign Dylibs for iOS
        run: find . -name "*.dylib" -exec ldid -S {} + || true

      - name: Upload iOS arm64 Dylibs
        uses: actions/upload-artifact@v4
        with:
          name: hl2sbpp-ios-arm64-dylibs
          path: |
            **/client.dylib
            **/server.dylib
            **/*.dylib
